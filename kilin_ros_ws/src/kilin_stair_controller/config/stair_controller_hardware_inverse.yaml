kilin_stair_controller:
  ros__parameters:
    rate_hz: 100.0
    delay_start_sec: 3.0
    arm_enabled: true
    arm_timeout_sec: 18.0
    arm_ptp_duration_sec: 3.0
    arm_action_name: /kinova_joint_ptp
    arm_control_mode: com_closed_loop

    balance_state_topic: /kilin/balance_state
    stability_state_topic: /kilin/stability_state
    terrain_state_topic: /kilin/stair_terrain
    balance_state_timeout_sec: 0.5
    require_balance_orientation: true

    # Publish through the already validated Kilin panel forwarding path:
    # stair controller -> /kilin/motor_cmd_raw -> panel -> /motor/command.
    command_topic: /kilin/motor_cmd_raw
    require_start_service: true
    require_command_subscriber: true

    com_safe_margin_m: 0.015
    # FL, FR, RL, RR swing phases. Preserve the existing hardware release gates.
    com_safe_margin_by_phase_m: [0.025, 0.023, 0.015, 0.025]
    # Preserve the empirically selected RL/RR minimum extension constraints.
    com_min_alpha_by_phase: [0.0, 0.0, 0.90, 0.75]
    com_alpha_step: 0.05
    com_safe_hold_sec: 0.3

    # Hardware inverse experiment: solve to 1 mm below each phase's release
    # margin, then retain measured 0.05-alpha refinement and the safe hold gate.
    com_use_inverse_initial_alpha: true
    com_inverse_target_relative_to_release: true
    com_inverse_target_margin_offset_m: 0.001
    # Backward-compatible absolute target; ignored while relative mode is true.
    com_inverse_target_margin_m: 0.014
    com_inverse_min_refinement_steps: 0
    amr_yaw_in_world_deg: 0.0

    # Hardware Kinova base is mounted backward: J1=180 deg faces AMR forward.
    arm_base_yaw_offset_deg: 180.0
    standard_pose_deg: [180.0, -85.94, 0.0, 147.0, 0.0, 22.92, 0.0]
    full_extension_pose_deg: [180.0, 90.0, 0.0, 0.0, 0.0, 0.0]
    front_left_pose_deg: [135.0, 90.0, 0.0, -40.0, 0.0, 90.0, 0.0]
    front_right_pose_deg: [-135.0, 90.0, 0.0, -40.0, 0.0, 90.0, 0.0]
    rear_left_pose_deg: [45.0, 100.0, 0.0, 0.0, 0.0, 90.0, 0.0]
    rear_right_pose_deg: [-45.0, 90.0, 0.0, -40.0, 0.0, 90.0, 0.0]

    # MotorState feedback was verified with all physical hips at zero; there
    # is no A/B sign correction or hidden 40-deg feedback offset.
    invert_ab_hips_on_hardware: false
    trigger_chip: /dev/gpiochip0
    trigger_line: 112
